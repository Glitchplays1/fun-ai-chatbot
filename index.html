<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun AI Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .chat-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            overflow: hidden;
        }
        .header {
            background: #4a90e2;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
        }
        .messages {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #f9f9f9;
        }
        .message {
            margin: 10px 0;
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 80%;
        }
        .user {
            background: #4a90e2;
            color: white;
            margin-left: auto;
            text-align: right;
        }
        .ai {
            background: #e0e0e0;
            color: black;
        }
        .input-area {
            display: flex;
            padding: 15px;
            background: white;
            border-top: 1px solid #ddd;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #4a90e2;
            border-radius: 25px;
            outline: none;
            font-size: 16px;
        }
        button {
            margin-left: 10px;
            padding: 12px 20px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #357abd;
        }
        .welcome {
            text-align: center;
            color: #666;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">Â Your Fun AI Buddy</div>
        <div class="messages" id="messages">
            <div class="welcome">
                <h2>Hi! I'm your simple AI chatbot</h2>
                <p>Ask me for a joke, a fact, or about space!<br>Type 'quit' to... well, just refresh the page 😄</p>
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type your message..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        function simpleAI(input) {
            input = input.toLowerCase().trim();
            
            if (['hello', 'hi', 'hey'].some(word => input.includes(word))) {
                const greetings = [
                    "Hi there! I'm your friendly AI buddy. What do you want to talk about?",
                    "Hello! Ready for some fun AI chat?",
                    "Hey! I'm an AI made just for you. Ask me anything cool!"
                ];
                return greetings[Math.floor(Math.random() * greetings.length)];
            }
            
            if (input.includes('joke')) {
                const jokes = [
                    "Why did the computer go to the doctor? Because it had a virus!",
                    "What do you call a computer that sings? A-Dell!",
                    "Why was the math book sad? It had too many problems!"
                ];
                return jokes[Math.floor(Math.random() * jokes.length)];
            }
            
            if (input.includes('fact') || input.includes('tell me something')) {
                const facts = [
                    "Did you know that octopuses have three hearts?",
                    "The longest word in the English dictionary is pneumonoultramicroscopicsilicovolcanoconiosis!",
                    "Honey never spoils. Archaeologists have found pots of honey in ancient Egyptian tombs that are over 3,000 years old and still edible!"
                ];
                return facts[Math.floor(Math.random() * facts.length)];
            }
            
            if (input.includes('ai') || input.includes('what are you')) {
                return "I'm a simple AI chatbot running in your browser! Real AIs learn from lots of data, but I'm a basic version that uses rules to chat with you. Pretty cool, right?";
            }
            
            if (['space', 'planet', 'star'].some(word => input.includes(word))) {
                return "Space is amazing! There are billions of stars in our galaxy. The closest star to Earth after the Sun is Proxima Centauri.";
            }
            
            const defaults = [
                "That's interesting! Can you tell me more?",
                "Hmm, I'm still learning. Try asking me for a joke or a fact!",
                "Cool! What else would you like to know?",
                "I'm a simple AI, so I do best with questions about jokes, facts, or space!"
            ];
            return defaults[Math.floor(Math.random() * defaults.length)];
        }

        function addMessage(text, isUser) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'message ' + (isUser ? 'user' : 'ai');
            div.textContent = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;
            
            addMessage(text, true);
            input.value = '';
            
            setTimeout(() => {
                const response = simpleAI(text);
                addMessage(response, false);
            }, 500);
        }
    </script>
</body>
</html>
